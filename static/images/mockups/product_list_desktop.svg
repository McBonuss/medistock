<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="40" y="60" font-family="Arial" font-size="22" fill="#0f172a">Product List — Desktop</text>
  <!-- header -->
  <rect x="40" y="80" width="1120" height="64" rx="8" fill="#fff" stroke="#e6eef8"/>
  <text x="80" y="120" font-family="Arial" font-size="16" fill="#475569">Search products, filters, categories</text>
  <!-- product grid -->
  <g transform="translate(40,160)">
    <!-- three columns -->
    <g transform="translate(0,0)">
      <rect width="340" height="220" rx="8" fill="#fff" stroke="#e6eef8"/>
      <rect x="20" y="20" width="300" height="120" rx="6" fill="#f1f5f9"/>
      <text x="170" y="165" font-family="Arial" font-size="16" fill="#0b1220" text-anchor="middle">MedPack 250</text>
      <rect x="110" y="185" width="120" height="28" rx="6" fill="#4f46e5"/>
      <text x="170" y="205" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Add to Cart</text>
    </g>
    <g transform="translate(380,0)">
      <rect width="340" height="220" rx="8" fill="#fff" stroke="#e6eef8"/>
      <rect x="20" y="20" width="300" height="120" rx="6" fill="#fef3c7"/>
      <text x="170" y="165" font-family="Arial" font-size="16" fill="#0b1220" text-anchor="middle">Syringes 10ml</text>
      <rect x="110" y="185" width="120" height="28" rx="6" fill="#047857"/>
      <text x="170" y="205" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Low stock</text>
    </g>
    <g transform="translate(760,0)">
      <rect width="340" height="220" rx="8" fill="#fff" stroke="#e6eef8"/>
      <rect x="20" y="20" width="300" height="120" rx="6" fill="#dbeafe"/>
      <text x="170" y="165" font-family="Arial" font-size="16" fill="#0b1220" text-anchor="middle">Gauze Pack</text>
      <rect x="110" y="185" width="120" height="28" rx="6" fill="#4b5563"/>
      <text x="170" y="205" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">View</text>
    </g>
  </g>
</svg>